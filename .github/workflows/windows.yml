name: Android build on Windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install chromium
      - name: Test Android assets
        run: |
          python -X utf8 tests/test_app.py 2>&1 | Tee-Object tests.log
          $testExit = $LASTEXITCODE
          '### Android asset tests' | Add-Content $env:GITHUB_STEP_SUMMARY
          '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content tests.log -Encoding utf8 | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $testExit
      - name: Build APK and run Android Lint
        if: ${{ !cancelled() }}
        run: python tools/build.py
