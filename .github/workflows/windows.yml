name: Android build on Windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install chromium
      - name: Test Android assets
        run: |
          $env:PYTHONUTF8 = '1'
          cmd /d /c 'python tests/test_app.py > tests.log 2>&1'
          $testExit = $LASTEXITCODE
          $testOutput = @(Get-Content tests.log -Encoding utf8)
          $testOutput | Write-Output
          if ($testExit -ne 0) {
            $details = ($testOutput | Select-Object -First 45) -join '%0A'
            Write-Output "::error::$details"
          }
          exit $testExit
      - name: Build APK and run Android Lint
        if: ${{ !cancelled() }}
        run: python tools/build.py
